<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { display: flex; flex-direction: column; max-width: 400px; gap: 10px; margin-bottom: 20px; }
        input { padding: 8px; font-size: 14px; }
        button { padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>

    <h2>Student Management System</h2>

    <form id="studentForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="phone" placeholder="Phone" required>
        <input type="text" id="course" placeholder="Course" required>
        <input type="text" id="department" placeholder="Department" required>
        <input type="text" id="year" placeholder="Year" required>
        <button type="submit">Add Student</button>
    </form>

    <h3>Student List</h3>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Course</th>
                <th>Department</th>
                <th>Year</th>
            </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
    </table>

    <script>
        async function loadStudents() {
            try {
                const response = await fetch('/api/students');
                const students = await response.json();
                const tableBody = document.getElementById('studentTableBody');
                tableBody.innerHTML = '';

                students.forEach(s => {
                    tableBody.innerHTML += `
                        <tr>
                            <td>${s.name}</td>
                            <td>${s.email}</td>
                            <td>${s.phone}</td>
                            <td>${s.course}</td>
                            <td>${s.department}</td>
                            <td>${s.year}</td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Failed to load students:", err);
            }
        }

        document.getElementById('studentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const studentData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                course: document.getElementById('course').value,
                department: document.getElementById('department').value,
                year: document.getElementById('year').value
            };

            const response = await fetch('/api/students', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(studentData)
            });

            if (response.ok) {
                document.getElementById('studentForm').reset();
                loadStudents();
            } else {
                alert('Failed to add student');
            }
        });

        loadStudents();
    </script>
</body>
</html>
